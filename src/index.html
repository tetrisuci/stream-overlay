<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cascade Clash · Stream Overlay</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    :root {
      --camera-width: 353.28px;
      --camera-height: 198.72px;
    }

    /* Full-width top bar. Its shape (including the scoreboard cutout) is drawn by buildTopBar(). */
    .top-bar { position: absolute; top: 0; left: 0; width: 1920px; pointer-events: none; }
    .top-bar path { fill: var(--panel); stroke: var(--outline); stroke-width: var(--outline-width); stroke-linejoin: miter; }
    .scoreboard-guide { display: none; position: absolute; top: 0; }
    .camera {
      position: absolute;
      bottom: var(--bar-height);
      width: var(--camera-width);
      height: var(--camera-height);
      border: var(--outline-width) solid var(--outline);
      background: transparent;
    }
    .camera--left { left: 0; }
    .camera--right { right: 0; }
    .camera::after {
      content: "";
      position: absolute;
      inset: -1px;
      pointer-events: none;
      background:
        linear-gradient(var(--outline), var(--outline)) left top / 24px 6px no-repeat,
        linear-gradient(var(--outline), var(--outline)) left top / 6px 24px no-repeat,
        linear-gradient(var(--outline), var(--outline)) right top / 24px 6px no-repeat,
        linear-gradient(var(--outline), var(--outline)) right top / 6px 24px no-repeat;
    }
    /* Pronouns sit in the footer at the end of each player's column that faces the logo. */
    .pronouns {
      flex: none;
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .pronouns[hidden] { display: none; }
    .pronouns.is-placeholder { color: #8d8d95; }
    .player { min-width: 0; padding: 0 22px; display: flex; align-items: center; gap: 18px; }
    .player-name { display: block; flex: 1 1 0; min-width: 0; height: 74px; overflow: visible; }
    .player-name text {
      fill: var(--paper);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 100px; /* measured at 100px, then scaled to SETTINGS.nameFontSize by fitText() */
    }

    .preview .scoreboard-guide {
      display: grid;
      place-items: center;
      color: #8d8d95;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      border: 1px dashed #8d8d95;
    }
    .preview .camera::before {
      content: attr(aria-label);
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #8d8d95;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="overlay" aria-label="Tournament stream overlay">
    <svg class="top-bar" id="top-bar" aria-hidden="true"><path></path></svg>
    <img class="tetris-logo" src="assets/tetris@uci_logo.png" width="2048" height="2048" alt="Tetris at UCI">
    <div class="scoreboard-guide" id="scoreboard-guide" aria-hidden="true">Scoreboard</div>
    <div class="system-clock">
      <time class="system-clock-time" id="system-clock-time" aria-label="System time">
        <span class="system-clock-digits"></span>
      </time>
    </div>
    <div class="camera camera--left" aria-label="Player one camera"></div>
    <div class="camera camera--right" aria-label="Player two camera"></div>
    <footer class="bottom-bar">
      <div class="player">
        <svg class="player-name" data-player="1" role="img" aria-label="Player one"><text></text></svg>
        <span class="pronouns" aria-label="Player one pronouns"></span>
      </div>
      <div class="brand">
        <div class="logo-panel">
          <img class="event-logo" src="assets/cascade_clash_logo.png" width="811" height="319" alt="Cascade Clash">
        </div>
      </div>
      <div class="player">
        <span class="pronouns" aria-label="Player two pronouns"></span>
        <svg class="player-name" data-player="2" role="img" aria-label="Player two"><text></text></svg>
      </div>
    </footer>
  </main>
  <script src="stage.js"></script>
  <script src="state.js"></script>
  <script>
    // Player names and pronouns come from the control panel (control.html) when server.py is running;
    // without the server this page shows the defaults in state.js.
    const SETTINGS = {
      nameFontSize: 56,        // Player name size in pixels; shrinks automatically if a name is too long
      // Gap in the top bar that keeps the game's scoreboard visible (centered on the stage).
      scoreboardWidth: 540,    // Gap width in pixels
    };

    // URL overrides, handy for testing (they switch off live updates): ?p1=NAME&p2=NAME&pr1=PRONOUNS&pr2=PRONOUNS
    const hasOverrides = ["p1", "p2", "pr1", "pr2"].some((key) => params.has(key));
    let players = ["", ""];
    let pronouns = ["", ""];

    // Empty pronouns are hidden; the browser preview shows a placeholder so it can be positioned.
    function applyPronouns() {
      document.querySelectorAll(".pronouns").forEach((tab, index) => {
        const value = pronouns[index].trim();
        const preview = params.get("preview") === "1";
        tab.textContent = value || (preview ? "Pronouns" : "");
        tab.classList.toggle("is-placeholder", !value);
        tab.hidden = !value && !preview;
      });
    }

    startClock();

    // Size a name at SETTINGS.nameFontSize (shrinking uniformly if it would overflow its column),
    // flush left or right, with capitals centered vertically so both names share one baseline.
    function fitText(svg, value, alignRight = false) {
      const context = document.createElement("canvas").getContext("2d");
      context.font = '700 100px "Fredoka", "Arial Rounded MT Bold", Arial, sans-serif';
      const text = svg.querySelector("text");
      text.textContent = value;
      svg.setAttribute("aria-label", value);
      const metrics = context.measureText(value);
      const inkWidth = metrics.actualBoundingBoxLeft + metrics.actualBoundingBoxRight;
      if (!inkWidth) return;
      const capHeight = context.measureText("H").actualBoundingBoxAscent;
      const width = svg.clientWidth;
      const height = svg.clientHeight;
      const scale = Math.min(SETTINGS.nameFontSize / 100, width / inkWidth);
      const x = (alignRight ? width - inkWidth * scale : 0) + metrics.actualBoundingBoxLeft * scale;
      const y = (height + capHeight * scale) / 2;
      text.setAttribute("transform", `translate(${x} ${y}) scale(${scale})`);
    }

    // Draw the bar as two pieces (clock side and right side) with a full-height gap between them.
    // The outline is centered on the path, so the path runs half an outline-width outside the gap and
    // bottom edge (the visible gap stays exactly scoreboardWidth), and is pushed off-stage along the
    // top and outer edges so only the bottom and gap edges show.
    function buildTopBar() {
      const stageWidth = 1920;
      const barHeight = publishHeaderHeight();
      const { scoreboardWidth: w } = SETTINGS;
      const outline = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--outline-width"));
      const half = outline / 2;
      const gapLeft = (stageWidth - w) / 2;
      const left = gapLeft - half;
      const right = gapLeft + w + half;
      const bottom = barHeight - half;
      const off = -2 * outline;
      const svg = document.getElementById("top-bar");
      svg.setAttribute("width", stageWidth);
      svg.setAttribute("height", barHeight);
      svg.querySelector("path").setAttribute("d", [
        // Left piece (clock side) and right piece, both with square corners at the gap.
        `M ${off} ${off} H ${left} V ${bottom} H ${off} Z`,
        `M ${right} ${off} H ${stageWidth - off} V ${bottom} H ${right} Z`,
      ].join(" "));

      const guide = document.getElementById("scoreboard-guide");
      guide.style.left = `${gapLeft}px`;
      guide.style.width = `${w}px`;
      guide.style.height = `${barHeight}px`;
    }
    buildTopBar();

    function fitNames() {
      document.querySelectorAll(".player-name").forEach((svg, index) => {
        fitText(svg, players[index], index === 1);
      });
    }

    // Show whoever is playing now, and follow the control panel while it changes.
    let lastShown = "";
    function showCurrent(state) {
      const { p1, p2 } = state.current;
      const next = {
        names: [params.get("p1") ?? p1.name, params.get("p2") ?? p2.name],
        pronouns: [params.get("pr1") ?? p1.pronouns, params.get("pr2") ?? p2.pronouns],
      };
      const key = JSON.stringify(next);
      if (key === lastShown) return;
      lastShown = key;
      players = next.names;
      pronouns = next.pronouns;
      applyPronouns();
      fitNames();
    }

    startPreview();
    (async function start() {
      // Names are measured with canvas, so make sure the font is loaded before fitting them.
      await document.fonts.load('700 100px "Fredoka"').catch(() => {});
      await document.fonts.ready;
      showCurrent((await fetchSavedState()) ?? normalizeState(DEFAULT_STATE));
      if (hasOverrides) return;
      setInterval(async () => {
        const latest = await fetchSavedState();
        if (latest) showCurrent(latest);
      }, 1000);
    })();
  </script>
</body>
</html>
